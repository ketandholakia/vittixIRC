# VIRC (Vittix IRC Chat Client) — fdroiddata build recipe (draft)
#
# How to use:
#   1. Rename this file to <appid>.yml (matching the app's final Application ID).
#   2. Replace every <...> placeholder below.
#   3. Copy it to metadata/<appid>.yml in a fork of https://gitlab.com/fdroid/fdroiddata
#      and open a merge request. See fdroid/PUBLISHING.md for the full walkthrough.
#
# Modeled on other Flutter recipes (e.g. fr.emersion.goguma) and kept in sync
# with the app repo: version 1.0.0+1, built with Flutter 3.44.0.

Categories:
  - Internet
  - Messaging
License: GPL-3.0-or-later    # TODO: keep in sync with the LICENSE added to the repo
AuthorName: <your name>
SourceCode: https://github.com/<github-user>/vittixIRC
IssueTracker: https://github.com/<github-user>/vittixIRC/issues
Changelog: https://github.com/<github-user>/vittixIRC/releases

AutoName: VIRC

RepoType: git
Repo: https://github.com/<github-user>/vittixIRC.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0    # tag must exist in the repo before submitting
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.0
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
