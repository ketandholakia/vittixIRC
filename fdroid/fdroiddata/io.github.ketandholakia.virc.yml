Categories:
  - Internet
  - Messaging
License: GPL-3.0-or-later
AuthorName: Ketan Dholakia
SourceCode: https://github.com/ketandholakia/vittixIRC
IssueTracker: https://github.com/ketandholakia/vittixIRC/issues
Changelog: https://github.com/ketandholakia/vittixIRC/releases

AutoName: VIRC

RepoType: git
Repo: https://github.com/ketandholakia/vittixIRC.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: cc24c7368e6ae96b8fab3034448b71210e19c10c
    submodules: true
    output: build/app/outputs/flutter-apk/app-release.apk
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
