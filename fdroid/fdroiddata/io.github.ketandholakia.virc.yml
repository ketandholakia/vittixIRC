Categories:
  - Internet
  - Messaging
License: GPL-3.0-or-later
AuthorName: Ketan Dholakia
SourceCode: https://github.com/ketandholakia/vittixIRC
IssueTracker: https://github.com/ketandholakia/vittixIRC/issues
Changelog: https://github.com/ketandholakia/vittixIRC/releases

AutoName: VIRC

RepoType: git
Repo: https://github.com/ketandholakia/vittixIRC.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: aa8e414b57f3c32b2d972a429b7c3884b60bb136
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.0
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
